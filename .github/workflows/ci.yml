name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Go: build + test ─────────────────────────────────────────────────────
  go:
    name: Go build & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build web assets
        run: cd web && npm ci && npm run build

      - name: Build server (with embedded frontend)
        run: go build -tags embed_frontend -o huginn .

      - name: Run Go tests
        run: go test -race -timeout 120s -coverprofile=coverage.out -covermode=atomic ./...

      - name: Enforce critical package coverage floors
        run: ./scripts/check_go_coverage.sh

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # ── Windows: build + smoke test ──────────────────────────────────────────
  windows:
    name: Windows build & smoke test
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build web assets
        run: cd web && npm ci && npm run build
        shell: pwsh

      - name: Build server
        run: go build -tags embed_frontend -o huginn.exe .
        shell: pwsh

      - name: Smoke test
        run: .\huginn.exe version
        shell: pwsh

  # ── Playwright E2E: browser-level UI regression tests ────────────────────
  playwright-e2e:
    name: Playwright E2E tests
    runs-on: ubuntu-latest
    needs: go
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Install Playwright browsers
        run: cd web && npx playwright install chromium --with-deps

      - name: Run Playwright E2E tests
        run: cd web && npm run test:e2e:ci

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # ── No-LLM golden journeys: deterministic confidence gate ──────────────────
  no-llm-golden:
    name: No-LLM golden journeys
    runs-on: ubuntu-latest
    needs: go
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Run deterministic backend golden tests
        run: go test ./internal/agent ./internal/server -run 'TestChatWithAgent_ChannelMemoryReplication_QueuesFanout|TestChatWithAgent_WithoutReplicationContext_DoesNotQueueFanout|TestHandleWSMessage_ChannelLeadDelegation_GoldenPath' -count=1

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Install Playwright browsers
        run: cd web && npx playwright install chromium --with-deps

      - name: Run deterministic frontend golden journey tests
        run: cd web && npx playwright test e2e/golden-journeys.spec.ts --reporter=list

  # ── Shell script linting ──────────────────────────────────────────────────
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run shellcheck
        run: shellcheck install.sh

  # ── Auto-forward main ─────────────────────────────────────────────────────
  # When all checks pass on develop, fast-forward main to match.
  promote-main:
    name: Promote develop → main
    runs-on: ubuntu-latest
    needs: [go, windows, playwright-e2e, no-llm-golden, shellcheck]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fast-forward main to develop
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push origin HEAD:main
