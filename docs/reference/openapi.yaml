components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: HuginnToken
  responses:
    ErrorResponse:
      description: Error payload
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    GenericObjectResponse:
      description: Generic success response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/GenericObject"
  schemas:
    GenericObject:
      type: object
      additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]
    TokenResponse:
      type: object
      properties:
        token:
          type: string
      required: [token]
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        version:
          type: string
        satellite_connected:
          type: boolean
        relay:
          type: object
          additionalProperties: true
      required: [status, version]
    SessionManifest:
      type: object
      properties:
        session_id:
          type: string
        id:
          type: string
        title:
          type: string
        agent:
          type: string
        status:
          type: string
        source:
          type: string
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: true
    CreateSessionRequest:
      type: object
      properties:
        space_id:
          type: string
    CreateSessionResponse:
      type: object
      properties:
        session_id:
          type: string
      required: [session_id]
    UpdateSessionRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 512
      required: [title]
    DeleteSessionResponse:
      type: object
      properties:
        deleted:
          type: boolean
        permanent:
          type: boolean
        archived:
          type: boolean
      required: [deleted]
    SessionMessage:
      type: object
      properties:
        id:
          type: string
        seq:
          type: integer
        role:
          type: string
          enum: [user, assistant, tool, system, cost]
        content:
          type: string
        ts:
          type: string
          format: date-time
        agent:
          type: string
      additionalProperties: true
    SendMessageRequest:
      type: object
      properties:
        content:
          type: string
      required: [content]
    SendMessageResponse:
      type: object
      properties:
        content:
          type: string
      required: [content]
    Agent:
      type: object
      properties:
        name:
          type: string
        model:
          type: string
        provider:
          type: string
        endpoint:
          type: string
        system_prompt:
          type: string
        color:
          type: string
        icon:
          type: string
        memory_enabled:
          type: boolean
        version:
          type: integer
      required: [name]
      additionalProperties: true
    WorkflowStep:
      type: object
      properties:
        name:
          type: string
        agent:
          type: string
        prompt:
          type: string
        routine:
          type: string
        sub_workflow:
          type: string
        position:
          type: integer
      additionalProperties: true
    Workflow:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        schedule:
          type: string
        version:
          type: integer
        timeout_minutes:
          type: integer
        steps:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStep"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [name, steps]
      additionalProperties: true
    WorkflowRunRequest:
      type: object
      properties:
        inputs:
          type: object
          additionalProperties: true
    WorkflowRunResponse:
      type: object
      properties:
        status:
          type: string
        workflow_id:
          type: string
      required: [status, workflow_id]
    Connection:
      type: object
      properties:
        id:
          type: string
        provider:
          type: string
        account_label:
          type: string
        account_id:
          type: string
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
      required: [id, provider]
      additionalProperties: true
    StartOAuthRequest:
      type: object
      properties:
        provider:
          type: string
      required: [provider]
    StartOAuthResponse:
      type: object
      properties:
        auth_url:
          type: string
      required: [auth_url]
    ModelsMapResponse:
      type: object
      additionalProperties:
        type: string
    AvailableModelsResponse:
      type: object
      properties:
        models:
          type: array
          items:
            type: object
            additionalProperties: true
        builtin_models:
          type: array
          items:
            type: object
            additionalProperties: true
        provider_models:
          type: array
          items:
            type: object
            additionalProperties: true
        error:
          type: string
      additionalProperties: false
    StatsResponse:
      type: object
      properties:
        last_prompt_tokens:
          type: integer
        last_completion_tokens:
          type: integer
      additionalProperties: true
    CostResponse:
      type: object
      properties:
        session_total_usd:
          type: number
      required: [session_total_usd]
    LogsResponse:
      type: object
      properties:
        lines:
          type: array
          items:
            type: string
      required: [lines]
    ConfigResponse:
      type: object
      additionalProperties: true
    ConfigUpdateRequest:
      type: object
      additionalProperties: true
    ConfigUpdateResponse:
      type: object
      properties:
        saved:
          type: boolean
        requires_restart:
          type: boolean
      required: [saved, requires_restart]
    SessionArtifactSummary:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        kind:
          type: string
        status:
          type: string
        mime_type:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required: [id, title]
      additionalProperties: true
    SessionArtifact:
      type: object
      properties:
        id:
          type: string
        session_id:
          type: string
        title:
          type: string
        kind:
          type: string
        status:
          type: string
        content:
          type: string
      required: [id]
      additionalProperties: true
    SessionArtifactCreateRequest:
      type: object
      properties:
        title:
          type: string
      required: [title]
      additionalProperties: true
    ArtifactCreateResponse:
      type: object
      properties:
        id:
          type: string
      required: [id]
    ArtifactStatusUpdateRequest:
      type: object
      properties:
        status:
          type: string
        reason:
          type: string
      required: [status]
    ArtifactStatusResponse:
      type: object
      properties:
        status:
          type: string
      required: [status]
    CloudStatusResponse:
      type: object
      properties:
        registered:
          type: boolean
        connected:
          type: boolean
        machine_id:
          type: string
        cloud_url:
          type: string
      required: [registered, connected]
    CloudConnectResponse:
      type: object
      properties:
        status:
          type: string
      required: [status]
    MuninnStatusResponse:
      type: object
      properties:
        connected:
          type: boolean
        detected:
          type: boolean
        endpoint:
          type: string
        username:
          type: string
      required: [connected, detected]
      additionalProperties: true
    MuninnVaultsResponse:
      type: object
      properties:
        vaults:
          type: array
          items:
            type: string
        endpoint:
          type: string
        username:
          type: string
        connected:
          type: boolean
      required: [vaults, connected]
      additionalProperties: true
    MuninnCreateVaultRequest:
      type: object
      properties:
        vault_name:
          type: string
        agent_label:
          type: string
      required: [vault_name, agent_label]
    MuninnCreateVaultResponse:
      type: object
      properties:
        vault_name:
          type: string
        token:
          type: string
      required: [vault_name, token]
    MuninnToolRequest:
      type: object
      properties:
        vault:
          type: string
        tool:
          type: string
        args:
          type: object
          additionalProperties: true
      required: [tool]
    MuninnToolResponse:
      type: object
      properties:
        result:
          type: object
          additionalProperties: true
      additionalProperties: true
    SkillItem:
      type: object
      properties:
        name:
          type: string
        author:
          type: string
        source:
          type: string
        enabled:
          type: boolean
        tool_count:
          type: integer
      required: [name, enabled, tool_count]
