openapi: 3.1.0
info:
  title: Huginn API
  version: 0.1.0
  description: |
    Initial contract scaffold for Huginn's HTTP API.
    This spec currently focuses on core session/chat, agent, workflow, connection,
    and system endpoints used by the web app. It is intended to be expanded
    incrementally as additional routes are hardened.
servers:
  - url: http://localhost:8080
    description: Local development server
security:
  - bearerAuth: []
tags:
  - name: System
  - name: Sessions
  - name: Agents
  - name: Workflows
  - name: Connections
  - name: Skills
paths:
  /api/v1/token:
    get:
      tags: [System]
      summary: Fetch current API bearer token
      security: []
      responses:
        "200":
          description: Token returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
  /api/v1/health:
    get:
      tags: [System]
      summary: Health and version status
      security: []
      responses:
        "200":
          description: Service healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /api/v1/stats:
    get:
      tags: [System]
      summary: Runtime token usage counters
      responses:
        "200":
          description: Stats snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatsResponse"
  /api/v1/cost:
    get:
      tags: [System]
      summary: Total session cost aggregate
      responses:
        "200":
          description: Cost aggregate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostResponse"
  /api/v1/logs:
    get:
      tags: [System]
      summary: Tail application logs
      parameters:
        - in: query
          name: n
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 1000
            default: 100
      responses:
        "200":
          description: Log lines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/config:
    get:
      tags: [System]
      summary: Fetch current (redacted) config
      responses:
        "200":
          description: Current config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
    put:
      tags: [System]
      summary: Update config
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigUpdateRequest"
      responses:
        "200":
          description: Config saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigUpdateResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/models:
    get:
      tags: [System]
      summary: Get configured model assignments
      responses:
        "200":
          description: Model map
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelsMapResponse"
  /api/v1/models/available:
    get:
      tags: [System]
      summary: Discover available local and provider models
      responses:
        "200":
          description: Available models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailableModelsResponse"
  /api/v1/sessions:
    get:
      tags: [Sessions]
      summary: List sessions
      parameters:
        - in: query
          name: include_archived
          required: false
          schema:
            type: boolean
        - in: query
          name: include_routine_sessions
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Session manifests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionManifest"
        "500":
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [Sessions]
      summary: Create session
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "200":
          description: Session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateSessionResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/sessions/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      tags: [Sessions]
      summary: Get session by id
      responses:
        "200":
          description: Session payload
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404":
          $ref: "#/components/responses/ErrorResponse"
    patch:
      tags: [Sessions]
      summary: Update session metadata
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionRequest"
      responses:
        "200":
          description: Updated session manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionManifest"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      tags: [Sessions]
      summary: Delete (or archive) session
      parameters:
        - in: query
          name: archive
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: Delete result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteSessionResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/sessions/{id}/messages:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      tags: [Sessions]
      summary: List session messages
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 50
        - in: query
          name: before_seq
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Session timeline messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionMessage"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags: [Sessions]
      summary: Send one message and get assistant reply
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageRequest"
      responses:
        "200":
          description: Assistant response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SendMessageResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/agents:
    get:
      tags: [Agents]
      summary: List agents
      responses:
        "200":
          description: Agent definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
  /api/v1/agents/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
    get:
      tags: [Agents]
      summary: Get one agent
      responses:
        "200":
          description: Agent definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    put:
      tags: [Agents]
      summary: Create or update agent by name
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Agent"
      responses:
        "200":
          description: Save acknowledgement
          content:
            application/json:
              schema:
                type: object
                properties:
                  saved:
                    type: string
                required: [saved]
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      tags: [Agents]
      summary: Delete agent
      responses:
        "200":
          description: Delete acknowledgement
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                required: [deleted]
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/workflows:
    get:
      tags: [Workflows]
      summary: List workflows
      responses:
        "200":
          description: Workflows
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Workflow"
    post:
      tags: [Workflows]
      summary: Create workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Workflow"
      responses:
        "200":
          description: Workflow created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "422":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/workflows/validate:
    post:
      tags: [Workflows]
      summary: Validate workflow payload (no persistence)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Workflow"
      responses:
        "200":
          description: Valid workflow
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                required: [valid]
        "422":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/workflows/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    get:
      tags: [Workflows]
      summary: Get workflow by id
      responses:
        "200":
          description: Workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "404":
          $ref: "#/components/responses/ErrorResponse"
    put:
      tags: [Workflows]
      summary: Update workflow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Workflow"
      responses:
        "200":
          description: Updated workflow
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workflow"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "422":
          $ref: "#/components/responses/ErrorResponse"
    delete:
      tags: [Workflows]
      summary: Delete workflow
      responses:
        "200":
          description: Delete acknowledgement
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: string
                required: [deleted]
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/workflows/{id}/run:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
    post:
      tags: [Workflows]
      summary: Trigger workflow run
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowRunRequest"
      responses:
        "200":
          description: Trigger accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowRunResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "409":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/connections:
    get:
      tags: [Connections]
      summary: List configured connections
      responses:
        "200":
          description: Connections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connection"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/connections/start:
    post:
      tags: [Connections]
      summary: Start OAuth flow for provider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartOAuthRequest"
      responses:
        "200":
          description: OAuth start response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartOAuthResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "429":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/skills:
    get:
      tags: [Skills]
      summary: List installed skills
      responses:
        "200":
          description: Installed skills
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SkillItem"
    post:
      tags: [Skills]
      summary: Create skill from markdown content
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content:
                  type: string
              required: [content]
      responses:
        "201":
          description: Skill created
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required: [name]
        "400":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/skills/install:
    post:
      tags: [Skills]
      summary: Install skill from registry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                target:
                  type: string
              required: [target]
      responses:
        "201":
          description: Skill installed
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                required: [name]
        "404":
          $ref: "#/components/responses/ErrorResponse"
        "502":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/skills/{name}:
    parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
    get:
      tags: [Skills]
      summary: Get installed skill details
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
    put:
      tags: [Skills]
      summary: Update skill markdown
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
    delete:
      tags: [Skills]
      summary: Uninstall skill
      responses:
        "204":
          description: Skill removed
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "500":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/skills/{name}/enable:
    parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
    put:
      tags: [Skills]
      summary: Enable installed skill
      responses:
        "204":
          description: Skill enabled
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/skills/{name}/disable:
    parameters:
      - in: path
        name: name
        required: true
        schema:
          type: string
    put:
      tags: [Skills]
      summary: Disable installed skill
      responses:
        "204":
          description: Skill disabled
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/v1/sessions/search:
    get:
      tags: [Sessions]
      summary: Search sessions
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/sessions/{id}/threads:
    get:
      tags: [Sessions]
      summary: List session threads
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
    post:
      tags: [Sessions]
      summary: Create session thread
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/sessions/{id}/chat/stream:
    post:
      tags: [Sessions]
      summary: Stream chat response for session
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/agents/capability-matrix:
    get:
      tags: [Agents]
      summary: Get agent capability matrix
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/agents/capability-matrix/validate:
    post:
      tags: [Agents]
      summary: Validate toolbelt capability matrix
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/agents/{name}/clone:
    post:
      tags: [Agents]
      summary: Clone agent
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/agents/{name}/vault/test:
    post:
      tags: [Agents]
      summary: Test agent vault connection
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/agents/{name}/vault-status:
    get:
      tags: [Agents]
      summary: Get agent vault status
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/models/pull:
    post:
      tags: [System]
      summary: Pull model
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/models/{name}:
    delete:
      tags: [System]
      summary: Delete model
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/runtime/status:
    get:
      tags: [System]
      summary: Get runtime status
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/builtin/status:
    get:
      tags: [System]
      summary: Get builtin runtime status
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/builtin/download:
    post:
      tags: [System]
      summary: Download builtin runtime
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/builtin/models:
    get:
      tags: [System]
      summary: List builtin installed models
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/builtin/catalog:
    get:
      tags: [System]
      summary: List builtin model catalog
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/builtin/models/pull:
    post:
      tags: [System]
      summary: Pull builtin model
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/builtin/activate:
    post:
      tags: [System]
      summary: Activate builtin model
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/builtin/models/{name}:
    delete:
      tags: [System]
      summary: Delete builtin model
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/providers/{provider}/models:
    get:
      tags: [Connections]
      summary: List models for provider
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/stats/history:
    get:
      tags: [System]
      summary: Get stats history
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/metrics:
    get:
      tags: [System]
      summary: Get metrics snapshot
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/metrics/prometheus:
    get:
      tags: [System]
      summary: Get Prometheus metrics
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/log-level:
    get:
      tags: [System]
      summary: Get current log level
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
    put:
      tags: [System]
      summary: Set current log level
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/secrets:
    get:
      tags: [System]
      summary: List secret slots
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/secrets/{slot}:
    put:
      tags: [System]
      summary: Set secret value
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
    delete:
      tags: [System]
      summary: Delete secret value
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/active-state:
    get:
      tags: [System]
      summary: Get active state snapshot
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/active-state/restore:
    post:
      tags: [System]
      summary: Restore active state
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/sessions/{id}/active-state:
    get:
      tags: [Sessions]
      summary: Get session active state
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/sessions/{id}/artifacts:
    get:
      tags: [Sessions]
      summary: List session artifacts
      responses:
        "200":
          description: Session artifact summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionArtifactSummary"
    post:
      tags: [Sessions]
      summary: Create session artifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionArtifactCreateRequest"
      responses:
        "201":
          description: Artifact created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactCreateResponse"
  /api/v1/sessions/{id}/artifacts/{artifact_id}:
    get:
      tags: [Sessions]
      summary: Get session artifact
      responses:
        "200":
          description: Artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionArtifact"
    put:
      tags: [Sessions]
      summary: Update session artifact
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ArtifactStatusUpdateRequest"
      responses:
        "200":
          description: Artifact status update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArtifactStatusResponse"
    delete:
      tags: [Sessions]
      summary: Delete session artifact
      responses:
        "204":
          description: Artifact deleted
  /api/v1/sessions/{id}/artifacts/{artifact_id}/download:
    get:
      tags: [Sessions]
      summary: Download session artifact
      responses:
        "200":
          description: Artifact content stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /api/v1/artifacts:
    post:
      tags: [Sessions]
      summary: Create workforce artifact
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/artifacts/{id}:
    get:
      tags: [Sessions]
      summary: Get workforce artifact
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/artifacts/{id}/status:
    patch:
      tags: [Sessions]
      summary: Update workforce artifact status
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/agents/{name}/artifacts:
    get:
      tags: [Agents]
      summary: List artifacts for agent
      responses:
        "200":
          $ref: "#/components/responses/GenericObjectResponse"
  /api/v1/messages/{id}/thread:
    get:
      tags: [Sessions]
      summary: Get message thread
      responses:
        "200":
